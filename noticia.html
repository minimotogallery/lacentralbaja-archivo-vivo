<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#e8edf2" />
  <meta name="robots" content="index,follow" />
  <title>La Central Baja — Noticia</title>
  <link rel="icon" href="./assets/favicon.png" type="image/png" />
  <style>
    :root{--bg:#e8edf2;--paper:#f7f8f9;--ink:#0b0c0e;--muted:#5c6570;--line:#b8c1ca;--blue:#1c37ff;--orange:#f05a22;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;--sans:"Helvetica Neue",Helvetica,Arial,sans-serif}
    *{box-sizing:border-box} html{background:var(--bg)} body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased} a{color:inherit} button{font:inherit}
    .news-head{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:58px;padding:9px 18px;border-bottom:1px solid var(--ink);background:rgba(232,237,242,.95);backdrop-filter:blur(12px)}
    .news-brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-size:13px;font-weight:600}.news-brand img{width:22px;height:28px;object-fit:contain}.news-head-actions{display:flex;gap:8px;align-items:center}.news-head-actions a,.news-head-actions button{min-height:36px;padding:0 10px;border:1px solid var(--ink);background:transparent;font:9px/1 var(--mono);text-transform:uppercase;text-decoration:none;cursor:pointer}.news-head-actions button:hover,.news-head-actions a:hover{background:var(--ink);color:#fff}
    .news-shell{width:min(1320px,100%);margin:0 auto;padding:clamp(32px,6vw,86px) 18px 72px}.news-meta{display:flex;justify-content:space-between;gap:18px;padding-bottom:14px;border-bottom:1px solid var(--ink);font:9px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
    h1{max-width:1120px;margin:clamp(34px,6vw,80px) 0 clamp(30px,5vw,64px);font-size:clamp(48px,8vw,126px);font-weight:500;line-height:.82;letter-spacing:-.072em;text-wrap:balance}.news-media{margin:0 0 clamp(30px,5vw,62px);border:1px solid var(--ink);background:#d6dde4}.news-metia[hidden]{display:none}.news-metia img{display:block;width:100%;max-height:72svh;object-fit:cover}.news-grid{display:grid;grid-template-columns:minmax(130px,.28fr) minmax(0,1fr);gap:clamp(24px,5vw,70px);padding-top:28px;border-top:1px solid var(--ink)}.news-aside{font:9px/1.5 var(--mono);text-transform:uppercase;color:var(--muted)}.news-body{max-width:820px;margin:0;font-size:clamp(18px,1.7vw,25px);line-height:1.45;letter-spacing:-.02em;white-space:pre-line;overflow-wrap:anywhere}.news-footer{display:flex;justify-content:space-between;gap:18px;margin-top:clamp(56px,8vw,110px);padding-top:18px;border-top:1px solid var(--ink);font:9px/1.3 var(--mono);text-transform:uppercase;color:var(--muted)}
    .news-error{max-width:720px;margin:100px auto;padding:22px;border:1px solid var(--ink);background:var(--paper)}
    @media(max-width:720px){.news-head{padding:8px 12px}.news-head-actions .desktop-only{display:none}.news-shell{padding-left:15px;padding-right:15px}h1{font-size:clamp(46px,15vw,78px);line-height:.88}.news-grid{grid-template-columns:1fr;gap:20px}.news-body{font-size:18px}.news-footer{align-items:flex-start;flex-direction:column}.news-media img{max-height:56svh}}
  </style>
</head>
<body>
  <header class="news-head">
    <a class="news-brand" href="./index.html"><img src="./assets/logo-central-baja.png" alt="" /><span>La Central Baja</span></a>
    <div class="news-head-actions">
      <button id="share-news" type="button">Compartir ↗</button>
      <a id="back-home" class="desktop-only" href="./index.html#ahora">Volver</a>
    </div>
  </header>

  <main id="news-main" class="news-shell" aria-live="polite">
    <div class="news-meta"><span id="news-tag">ARCHIVO VIVO</span><time id="news-date">—</time></div>
    <h1 id="news-title">Cargando…</h1>
    <figure id="news-media" class="news-media" hidden><img id="news-image" src="" alt="" /></figure>
    <div class="news-grid">
      <aside class="news-aside"><span>LCB / NOTICIA</span><br><span id="news-author"></span></aside>
      <p id="news-body" class="news-body"></p>
    </div>
    <footer class="news-footer"><span>La Central Baja · San Pío X · Murcia</span><span id="news-id"></span></footer>
  </main>

  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const id = params.get('id') || '';
      const lang = ['es','en','zh'].includes(params.get('lang')) ? params.get('lang') : 'es';
      const dict = {
        es:{loading:'Cargando…',notFound:'No hemos encontrado esta noticia.',share:'Compartir ↗',copied:'Enlace copiado ✓',back:'Volver',archive:'Archivo vivo',author:'La Central Baja',locale:'es-ES'},
        en:{loading:'Loading…',notFound:'This news item could not be found.',share:'Share ↗',copied:'Link copied ✓',back:'Back',archive:'Living archive',author:'La Central Baja',locale:'en-GB'},
        zh:{loading:'加载中…',notFound:'未找到这条消息。',share:'分享 ↗',copied:'链接已复制 ✓',back:'返回',archive:'活态档案',author:'La Central Baja',locale:'zh-CN'}
      }[lang];
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
      document.querySelector('#news-title').textContent = dict.loading;
      document.querySelector('#share-news').textContent = dict.share;
      document.querySelector('#back-home').textContent = dict.back;
      const home = lang === 'en' ? './index-en.html#now' : lang === 'zh' ? './index-zh.html#now' : './index.html#ahora';
      document.querySelector('.news-brand').href = home;
      document.querySelector('#back-home').href = home;

      const clean = value => String(value || '').replace(/\s+/g,' ').trim();
      function localizedField(item,key){
        if(lang === 'es') return item?.[key] ?? '';
        const suffix = lang;
        const camel = suffix[0].toUpperCase()+suffix.slice(1);
        for(const candidate of [`${key}_${suffix}`,`${key}${camel}`,`${key}-${suffix}`]){
          if(clean(item?.[candidate])) return item[candidate];
        }
        if(clean(item?.translations?.[lang]?.[key])) return item.translations[lang][key];
        return item?.[key] ?? '';
      }
      function tags(item){
        const value = localizedField(item,'tags') || item?.tags || [];
        return Array.isArray(value) ? value : clean(value).split(',').map(clean).filter(Boolean);
      }
      function formatDate(value){
        const date = new Date(Number(value)||value);
        return Number.isNaN(date.getTime()) ? '' : new Intl.DateTimeFormat(dict.locale,{day:'2-digit',month:'2-digit',year:'numeric'}).format(date);
      }
      function showError(){
        document.querySelector('#news-main').innerHTML = `<div class="news-error"><strong>${dict.notFound}</strong><p><a href="${home}">${dict.back} ↗</a></p></div>`;
        document.title = `La Central Baja — ${dict.notFound}`;
      }

      async function load(){
        if(!id) return showError();
        try{
          const response = await fetch('/api/board?limit=200',{headers:{Accept:'application/json'},cache:'no-store'});
          if(!response.ok) throw new Error(String(response.status));
          const data = await response.json();
          const posts = Array.isArray(data) ? data : (data.posts || data.items || []);
          const raw = posts.find(post => String(post.id) === id);
          if(!raw) return showError();
          const title = clean(localizedField(raw,'title')) || 'La Central Baja';
          const body = String(localizedField(raw,'body') || '').trim();
          const author = clean(localizedField(raw,'author')) || dict.author;
          const postTags = tags(raw);
          document.querySelector('#news-title').textContent = title;
          document.querySelector('#news-body').textContent = body;
          document.querySelector('#news-author').textContent = author;
          document.querySelector('#news-date').textContent = formatDate(raw.createdAt);
          document.querySelector('#news-tag').textContent = postTags[0] || dict.archive;
          document.querySelector('#news-id').textContent = `ID / ${id}`;
          if(raw.imageUrl){
            const media = document.querySelector('#news-media');
            const image = document.querySelector('#news-image');
            image.src = raw.imageUrl;
            image.alt = title;
            media.hidden = false;
          }
          document.title = `${title} — La Central Baja`;
          const description = body.replace(/\s+/g,' ').trim().slice(0,170);
          let meta = document.querySelector('meta[name="description"]');
          if(!meta){meta=document.createElement('meta');meta.name='description';document.head.append(meta)}
          meta.content = description;
        }catch(error){
          console.error(error);
          showError();
        }
      }

      document.querySelector('#share-news').addEventListener('click', async () => {
        const button = document.querySelector('#share-news');
        const title = document.querySelector('#news-title').textContent;
        try{
          if(navigator.share){
            await navigator.share({title,url:location.href});
          }else{
            await navigator.clipboard.writeText(location.href);
            button.textContent = dict.copied;
            setTimeout(()=>button.textContent=dict.share,1800);
          }
        }catch(error){
          if(error?.name !== 'AbortError') console.warn(error);
        }
      });

      load();
    })();
  </script>
</body>
</html>
